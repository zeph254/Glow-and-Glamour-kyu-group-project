<!DOCTYPE html>
<html lang="en">
<head>
    <!-- PWA Support -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e91e63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="images/logo-192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — Glow & Glamour</title>
    <link rel="icon" href="https://img.icons8.com/?size=100&id=5OcXRBmS83na&format=png&color=000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <a href="index.html" class="logo">Glow <span>&</span> Glamour</a>
    
    <!-- Hamburger Button -->
    <button class="hamburger" id="hamburger" aria-label="Toggle Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Desktop & Mobile Navigation -->
    <nav class="nav-links" id="nav-links">
      <a href="index.html" class="active">Shop</a>
      <a href="orders.html">My Orders</a>
      <a href="cart.html" class="cart-link">
        Cart <span id="cart-count" class="badge">0</span>
      </a>
      <!-- Close button for mobile -->
      <button class="close-menu" id="close-menu" aria-label="Close Menu">✕</button>
    </nav>
  </header>

  <main class="cart-page">
    <h1 class="cart-title">Your Shopping Cart</h1>

    <!-- Empty state -->
    <div id="empty-cart" class="empty-cart hidden">
      <div class="empty-icon">🛍️</div>
      <h2>Your cart is empty</h2>
      <p>Looks like you haven't added anything yet.</p>
      <a href="index.html" class="btn-primary">Continue Shopping</a>
    </div>

    <!-- Cart content -->
    <div id="cart-content" class="cart-content hidden">
      <div class="cart-items" id="cart-items">
        <!-- items injected by JS -->
      </div>

      <aside class="cart-summary">
        <h2>Order Summary</h2>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">KSh 0</span>
        </div>
        <div class="summary-row">
          <span>Items</span>
          <span id="item-count">0</span>
        </div>
        <div class="summary-row muted">
          <span>Shipping</span>
          <span>Calculated at checkout</span>
        </div>
        <hr>
        <div class="summary-row total">
          <span>Total</span>
          <span id="total">KSh 0</span>
        </div>

        <button id="clear-cart" class="btn-clear">Clear Cart</button>
        <a href="checkout.html" class="btn-checkout">Proceed to Checkout →</a>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Glow & Glamour · Beauty Shop Project</p>
  </footer>

  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/cart-page.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('Service Worker registered!', reg))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
